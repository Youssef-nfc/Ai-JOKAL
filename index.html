<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>JOKAL — مساعدك الذكي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
    --void: #060609; --surface: #111118; --surface-2: #17171f;
    --border: rgba(255,255,255,.07); --border-strong: rgba(255,255,255,.12);
    --accent: #8b9cf6; --accent-soft: rgba(139,156,246,.14);
    --success: #4fd1c5; --warning: #f6ad55; --error: #f66b6b;
    --text: rgba(255,255,255,.92); --text-2: rgba(255,255,255,.62); --text-3: rgba(255,255,255,.38); --text-4: rgba(255,255,255,.20);
    --font: "Noto Sans Arabic", Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    --header: 64px; --input-height: 78px; --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--void); color: var(--text); font-family: var(--font); overflow: hidden; }

/* Auth Overlay */
.auth-overlay { position: fixed; inset: 0; background: rgba(6,6,9,.95); backdrop-filter: blur(16px); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; transition: opacity .3s ease; }
.auth-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 24px; padding: 28px 22px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.auth-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.auth-subtitle { font-size: 13px; color: var(--text-2); margin-bottom: 24px; line-height: 1.6; }
.auth-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; color: white; font-size: 14px; margin-bottom: 12px; outline: none; }
.auth-input:focus { border-color: var(--accent); }
.auth-btn { width: 100%; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
.auth-btn-primary { background: var(--accent); color: #000; margin-bottom: 10px; }
.auth-btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-2); }
.auth-btn:active { transform: scale(.98); }

/* Main App */
.app { position: relative; width: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.topbar { position: fixed; top: 0; left: 0; right: 0; height: calc(var(--header) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 14px 0 14px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, rgba(6,6,9,.98), rgba(6,6,9,.86), transparent); backdrop-filter: blur(14px); z-index: 100; }
.menu-button { width: 42px; height: 42px; border-radius: 13px; background: rgba(255,255,255,.045); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-2); }
.brand { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; direction: ltr; }
.brand-core { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #b7c1ff, #7184ef 50%, #414fc0); box-shadow: 0 0 18px rgba(139,156,246,.35); }
.brand-name { font-family: Inter, sans-serif; font-size: 15px; font-weight: 700; color: white; }

.status { display: flex; align-items: center; gap: 6px; font-size: 9px; color: var(--text-3); direction: ltr; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

/* Chat */
.chat { flex: 1; width: 100%; padding: calc(var(--header) + 15px) 14px calc(var(--input-height) + 25px); overflow-y: auto; }
.welcome { min-height: 50vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.welcome-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.welcome-description { font-size: 13px; color: var(--text-2); }

.messages { display: flex; flex-direction: column; gap: 16px; }
.message { display: flex; width: 100%; }
.message.user { justify-content: flex-start; }
.message.user .bubble { background: var(--accent-soft); border: 1px solid rgba(139,156,246,.2); border-radius: 16px 16px 4px 16px; max-width: 82%; }
.message.ai { justify-content: flex-end; gap: 8px; }
.message.ai .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 16px 4px; max-width: 88%; }
.bubble { padding: 12px 14px; font-size: 14px; line-height: 1.7; word-break: break-word; }

/* Input */
.input-area { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--void); }
.input-wrapper { max-width: 680px; margin: auto; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }
.command-input { flex: 1; border: 0; outline: 0; background: transparent; color: white; font-size: 14px; padding: 8px; resize: none; }
.send { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; }

/* Menu */
.menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .3s; }
.menu-overlay.open { opacity: 1; pointer-events: auto; }
.menu-panel { position: absolute; top: 0; right: 0; width: 300px; height: 100%; background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.user-profile-box { padding: 12px; background: var(--surface-2); border-radius: 14px; border: 1px solid var(--border); }
.user-profile-name { font-weight: bold; font-size: 14px; color: white; }
.user-profile-email { font-size: 11px; color: var(--text-3); }
</style>
</head>

<body>

<!-- Modal Auth Screen -->
<div class="auth-overlay" id="authModal">
    <div class="auth-card">
        <div class="brand-core" style="margin: 0 auto 16px;"></div>
        <h2 class="auth-title">مرحباً بك في JOKAL</h2>
        <p class="auth-subtitle">ادخل اسمك وإيميلك للمتابعة وحفظ محادثاتك وذاكرتك الخاصة.</p>
        
        <input type="text" id="authName" class="auth-input" placeholder="الاسم (مثال: يوسف)">
        <input type="email" id="authEmail" class="auth-input" placeholder="البريد الإلكتروني (اختياري)">
        
        <button class="auth-btn auth-btn-primary" id="loginBtn">دخول / إنشاء حساب</button>
        <button class="auth-btn auth-btn-secondary" id="guestBtn">المتابعة كضيف 👻</button>
    </div>
</div>

<div class="app">
    <header class="topbar">
        <button class="menu-button" id="openMenu">☰</button>
        <div class="brand"><div class="brand-core"></div><div class="brand-name">JOKAL</div></div>
        <div class="status" id="status"><span class="status-dot"></span><span id="statusText">جاهز</span></div>
    </header>

    <main class="chat" id="chat">
        <section class="welcome" id="welcome">
            <h1 class="welcome-title" id="welcomeUserText">مرحباً 👋</h1>
            <p class="welcome-description">مساعدك الذكي الشخصي والخاص.</p>
        </section>
        <div class="messages" id="messages"></div>
    </main>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="commandInput" class="command-input" rows="1" placeholder="اكتب شي حاجة..."></textarea>
            <button class="send" id="sendButton">➤</button>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay">
        <aside class="menu-panel">
            <div class="user-profile-box">
                <div class="user-profile-name" id="menuProfileName">مستخدم</div>
                <div class="user-profile-email" id="menuProfileEmail">guest@jokal.ai</div>
            </div>
            <button class="auth-btn auth-btn-secondary" id="logoutBtn" style="color:var(--error); border-color:rgba(246,107,107,.2)">تسجيل الخروج</button>
        </aside>
    </div>
</div>

<script>
"use strict";

const API_URL = '/api/chat';
const USER_KEY = 'jokal_user_session';

let currentUser = JSON.parse(localStorage.getItem(USER_KEY) || 'null');
let conversationHistory = [];

const authModal = document.getElementById("authModal");
const authName = document.getElementById("authName");
const authEmail = document.getElementById("authEmail");
const loginBtn = document.getElementById("loginBtn");
const guestBtn = document.getElementById("guestBtn");
const welcomeUserText = document.getElementById("welcomeUserText");

const input = document.getElementById("commandInput");
const sendBtn = document.getElementById("sendButton");
const messages = document.getElementById("messages");
const menuOverlay = document.getElementById("menuOverlay");

// Init Auth
function checkAuth() {
    if (currentUser) {
        authModal.style.display = 'none';
        welcomeUserText.textContent = `مرحباً ${currentUser.name} 👋`;
        document.getElementById("menuProfileName").textContent = currentUser.name;
        document.getElementById("menuProfileEmail").textContent = currentUser.email || 'حساب ضيف';
    } else {
        authModal.style.display = 'flex';
    }
}

loginBtn.addEventListener('click', () => {
    const name = authName.value.trim() || 'مستخدم';
    const email = authEmail.value.trim() || `${Date.now()}@jokal.local`;
    currentUser = { id: 'usr_' + Date.now(), name, email, isGuest: false };
    localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
    checkAuth();
});

guestBtn.addEventListener('click', () => {
    currentUser = { id: 'guest_' + Date.now(), name: 'زائر', email: 'ضيف', isGuest: true };
    localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
    checkAuth();
});

document.getElementById("logoutBtn").addEventListener('click', () => {
    localStorage.removeItem(USER_KEY);
    currentUser = null;
    location.reload();
});

document.getElementById("openMenu").onclick = () => menuOverlay.classList.add("open");
menuOverlay.onclick = (e) => { if(e.target === menuOverlay) menuOverlay.classList.remove("open"); };

// Send Message
async function sendMessage() {
    const text = input.value.trim();
    if (!text || !currentUser) return;

    document.getElementById("welcome").style.display = "none";
    addMessage(text, "user");
    conversationHistory.push({ role: "user", content: text });
    input.value = "";

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "X-User-Id": currentUser.id
            },
            body: JSON.stringify({ 
                message: text, 
                history: conversationHistory.slice(-10),
                user: currentUser
            })
        });

        if (!res.ok) throw new Error("مشكل فالسيرفر");

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let reply = "";
        const aiBubble = addMessage("...", "ai");

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            reply += chunk;
            aiBubble.innerHTML = marked.parse(reply);
        }
        conversationHistory.push({ role: "model", content: reply });

    } catch (err) {
        addMessage("⚠️ تعذر الحصول على إجابة، حاول لاحقاً.", "ai");
    }
}

function addMessage(text, type) {
    const row = document.createElement("div"); 
    row.className = "message " + type;
    const bubble = document.createElement("div"); 
    bubble.className = "bubble";
    bubble.innerHTML = type === 'ai' ? marked.parse(text) : text;
    row.appendChild(bubble); 
    messages.appendChild(row);
    return bubble;
}

sendBtn.addEventListener("click", sendMessage);
checkAuth();
</script>

</body>
</html>
